	}

	  background: #fff;

	  color: #4b5563;

<body>
  <div class="filters">
    <select id="opponentFilter">
      <option value="">Minden ellenfél</option>
    </select>

    <input id="playerFilter" type="text" placeholder="Játékos keresése...">

	<div class="view-toggle">
	  <button id="fullMatchesBtn" class="active" type="button">
		Csapat nézet
	  </button>

	  <button id="duelsOnlyBtn" type="button">
		Játékos nézet
	  </button>
	</div>
  </div>
  <div id="summary" class="summary"></div>

  <div id="app">Betöltés...</div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    const app = document.getElementById("app");

	let allRows = [];
	let duelOnlyMode = false;

	function applyFilters() {
	  const opponent = document.getElementById("opponentFilter").value;
	  const player = document.getElementById("playerFilter").value.toLowerCase();
      const onlyPlayerDuels = duelOnlyMode;

	  let filteredRows;

	  if (player && !onlyPlayerDuels) {
		const matchingMatchKeys = new Set(
		  allRows
			.filter(row => {
			  const opponentOk = !opponent || row.opponent === opponent;

			  const playerOk =
				row.hu_player.toLowerCase().includes(player) ||
				row.opp_player.toLowerCase().includes(player);

			  return opponentOk && playerOk;
			})
			.map(row => `${row.year}-${row.match_no}`)
		);

		filteredRows = allRows.filter(row => {
		  const matchKey = `${row.year}-${row.match_no}`;
		  const opponentOk = !opponent || row.opponent === opponent;

		  return opponentOk && matchingMatchKeys.has(matchKey);
		});

	  } else {
		filteredRows = allRows.filter(row => {
		  const opponentOk = !opponent || row.opponent === opponent;

		  const playerOk =
			!player ||
			row.hu_player.toLowerCase().includes(player) ||
			row.opp_player.toLowerCase().includes(player);

		  return opponentOk && playerOk;
		});
	  }

	  renderSummary(filteredRows);
	  render(groupData(filteredRows));
	}

	function fillOpponentFilter(rows) {
	  const select = document.getElementById("opponentFilter");

	  const opponents = [...new Set(rows.map(r => r.opponent))]
		.filter(Boolean)
		.sort((a, b) => a.localeCompare(b, "hu"));

	  opponents.forEach(opponent => {
		const option = document.createElement("option");
		option.value = opponent;
		option.textContent = opponent;
		select.appendChild(option);
	  });

	  select.addEventListener("change", applyFilters);
	  document.getElementById("playerFilter").addEventListener("input", applyFilters);


	  const fullMatchesBtn = document.getElementById("fullMatchesBtn");
  	  const duelsOnlyBtn = document.getElementById("duelsOnlyBtn");

	  fullMatchesBtn.addEventListener("click", () => {
		  duelOnlyMode = false;

		  fullMatchesBtn.classList.add("active");
		  duelsOnlyBtn.classList.remove("active");

		  applyFilters();
	  });

	  duelsOnlyBtn.addEventListener("click", () => {
		  duelOnlyMode = true;

		  duelsOnlyBtn.classList.add("active");
		  fullMatchesBtn.classList.remove("active");

		  applyFilters();
	  });
	}

	function renderSummary(rows) {
	  const matches = {};

	  rows.forEach(row => {
		const key = `${row.year}-${row.match_no}`;

		if (!matches[key]) {
		  matches[key] = {
			match_hu: Number(row.match_hu),
			match_opp: Number(row.match_opp),
			duels: []
		  };
		}

		matches[key].duels.push({
		  hu_score: Number(row.hu_score),
		  opp_score: Number(row.opp_score)
		});
	  });

	  const matchList = Object.values(matches);

	  const matchWins = matchList.filter(m => m.match_hu > m.match_opp).length;
	  const matchLosses = matchList.filter(m => m.match_hu < m.match_opp).length;
	  const matchDraws = matchList.filter(m => m.match_hu === m.match_opp).length;

	  const duels = matchList.flatMap(m => m.duels);

	  const duelWins = duels.filter(d => d.hu_score > d.opp_score).length;
	  const duelCount = duels.length;
	  const duelWinRate = duelCount ? Math.round((duelWins / duelCount) * 100) : 0;

	  const gameWins = duels.reduce((sum, d) => sum + d.hu_score, 0);
	  const gameLosses = duels.reduce((sum, d) => sum + d.opp_score, 0);
	  const gameCount = gameWins + gameLosses;
	  const gameWinRate = gameCount ? Math.round((gameWins / gameCount) * 100) : 0;

	  const matchDetails = [
		`${matchWins} győzelem`,
		`${matchLosses} vereség`
	  ];

	  if (matchDraws > 0) {
		matchDetails.push(`${matchDraws} döntetlen`);
	  }

	  document.getElementById("summary").innerHTML = `
		<div class="summary-card">
		  <div class="summary-icon-circle match-bg">
			<i data-lucide="trophy" class="stat-icon match-icon"></i>
		  </div>
		  <div>
			<div class="summary-title">Mérkőzések</div>
			<div class="summary-main">${matchList.length}</div>
			<div class="summary-detail">${matchDetails.join(" · ")}</div>
		  </div>
		</div>

		<div class="summary-card">
		  <div class="summary-icon-circle duel-bg">
		    <i data-lucide="swords" class="stat-icon duel-icon"></i>
		  </div>		
		  <div>
			<div class="summary-title">Párharcok</div>
		    <div class="summary-main">${duelCount}</div>
  		    <div class="summary-detail">${duelWins} győzelem (${duelWinRate}%)</div>
		  </div>
		</div>

		<div class="summary-card">
		  <div class="summary-icon-circle game-bg">
		    <i data-lucide="chart-column" class="stat-icon game-icon"></i>
		  </div>		
		  <div>
			<div class="summary-title">Játszmák</div>
		  <div class="summary-main">${gameCount}</div>
		  <div class="summary-detail">${gameWins} győzelem (${gameWinRate}%)</div>
		  </div>
		</div>
	  `;

	  if (window.lucide) {
		lucide.createIcons();
	  }
	}

    function groupData(rows) {
      const years = {};

      rows.forEach(row => {
        const year = row.year;
        const matchKey = `${row.year}-${row.match_no}`;

        if (!years[year]) years[year] = {};

        if (!years[year][matchKey]) {
          years[year][matchKey] = {
            year: row.year,
            match_no: row.match_no,
            competition: row.competition,
            date: row.date,
            opponent: row.opponent,
            match_hu: Number(row.match_hu),
            match_opp: Number(row.match_opp),
            duels: []
          };
        }

        years[year][matchKey].duels.push({
          duel_no: Number(row.duel_no),
          hu_player: row.hu_player,
          hu_score: Number(row.hu_score),
          opp_score: Number(row.opp_score),
          opp_player: row.opp_player
        });
      });

      return years;
    }

	function competitionLabel(code) {
	  if (code === "vb") return "WTCOC";
	  if (code === "Eb") return "ETCOC";
      if (code === "-") return "Barátságos m.";
      return code;
	}

	function formatDate(year, shortDate) {

	  const months = [
		"jan.",
		"febr.",
		"márc.",
		"ápr.",
		"máj.",
		"jún.",
		"júl.",
		"aug.",
		"szept.",
		"okt.",
		"nov.",
		"dec."
	  ];

	  const parts = shortDate.split(".");

	  const month = Number(parts[0]);
	  const day = Number(parts[1]);

	  return `${year}. ${months[month - 1]} ${day}.`;
	}
	
    function resultClass(match) {
      if (match.match_hu > match.match_opp) return "win";
      if (match.match_hu < match.match_opp) return "loss";
      return "draw";
    }

    function render(years) {
      app.innerHTML = "";

	  Object.keys(years).sort((a, b) => b - a).forEach((year, index) => {
		const yearBlock = document.createElement("section");
		yearBlock.className = index === 0 ? "year-block first-year" : "year-block";

		const matches = Object.values(years[year])
		  .sort((a, b) => Number(b.match_no) - Number(a.match_no));

		const wins = matches.filter(m => m.match_hu > m.match_opp).length;
		const losses = matches.filter(m => m.match_hu < m.match_opp).length;
		const draws = matches.filter(m => m.match_hu === m.match_opp).length;

		const duelWins = matches.reduce((sum, m) =>
		  sum + m.duels.filter(d => d.hu_score > d.opp_score).length, 0
		);

		const duelCount = matches.reduce((sum, m) => sum + m.duels.length, 0);

		const duelWinRate = duelCount
		  ? Math.round((duelWins / duelCount) * 100)
		  : 0;

		const stats = [
		  `${matches.length} mérkőzés`,
		  `${wins} győzelem`,
		  `${losses} vereség`
		];

		if (draws > 0) {
		  stats.push(`${draws} döntetlen`);
		}

		stats.push(`${duelWinRate}% párharcgyőzelem`);

		const matchTextParts = [
		  `${matches.length} mérkőzés`,
		  `${wins} győzelem`,
		  `${losses} vereség`
		];

		if (draws > 0) {
		  matchTextParts.push(`${draws} döntetlen`);
		}

		const gameWins = matches.reduce((sum, m) =>
		  sum + m.duels.reduce((s, d) => s + d.hu_score, 0), 0
		);

		const gameLosses = matches.reduce((sum, m) =>
		  sum + m.duels.reduce((s, d) => s + d.opp_score, 0), 0
		);

		const gameCount = gameWins + gameLosses;

		const gameWinRate = gameCount
		  ? Math.round((gameWins / gameCount) * 100)
		  : 0;

		yearBlock.innerHTML = `
		  <div class="year-header">
		    <div class="year">${year}</div>

		    <div class="year-summary">
			  <div class="year-summary-line">
			    <i data-lucide="trophy" class="stat-icon match-icon"></i>
			    <span>${matchTextParts.join(" · ")}</span>
			  </div>

			  <div class="year-summary-line">
			    <i data-lucide="swords" class="stat-icon duel-icon"></i>
			    <span>${duelCount} párharc · ${duelWins} győzelem (${duelWinRate}%)</span>
			  </div>

			  <div class="year-summary-line">
			    <i data-lucide="chart-column" class="stat-icon game-icon"></i>
			    <span>${gameCount} játszma · ${gameWins} győzelem (${gameWinRate}%)</span>
			  </div>
	  	    </div>
		  </div>

		`;

        const matchesDiv = document.createElement("div");
        matchesDiv.className = "matches";

        matches.forEach(match => {
          const duelsHtml = match.duels
            .sort((a, b) => a.duel_no - b.duel_no)
            .map(duel => {
              const huWon = duel.hu_score > duel.opp_score;

              return `
                <div class="duel">
                  <div class="player ${huWon ? "player-win" : "player-loss"}">${duel.hu_player}</div>
                  <div class="duel-score">${duel.hu_score}–${duel.opp_score}</div>
                  <div class="opp-player">${duel.opp_player}</div>
                </div>
              `;
            })
            .join("");

          const card = document.createElement("article");
		  
	  	  let competitionClass = "card-friendly";

		  if (match.competition === "vb") {
		    competitionClass = "card-vb";
		  }

		  if (match.competition === "Eb") {
		    competitionClass = "card-eb";
		  }

		  card.className = `card ${competitionClass}`;		  

          card.innerHTML = `
			
			<div class="opponent">
			  <img class="flag"	src="flags/${countryFlag(match.opponent)}.webp" alt="">
			  ${match.opponent}
			</div>			
			
            <div class="meta">${formatDate(match.year, match.date)} · ${competitionLabel(match.competition)}</div>
            <div class="score ${resultClass(match)}">${match.match_hu} – ${match.match_opp}</div>
            ${duelsHtml}
          `;

          matchesDiv.appendChild(card);
        });

        yearBlock.appendChild(matchesDiv);
        app.appendChild(yearBlock);
		
		if (window.lucide) {
		  lucide.createIcons();
		}		
		
      });
    }

    window.handleSheetData = function(response) {
      try {
        const cols = response.table.cols.map(col => col.label);

        const rows = response.table.rows.map(r => {
          const obj = {};

          cols.forEach((col, i) => {
            obj[col] =
              r.c[i] && r.c[i].v !== null
                ? String(r.c[i].v).trim()
                : "";
          });

          return obj;
        });

		allRows = rows;

		fillOpponentFilter(rows);

		renderSummary(rows);
		render(groupData(rows));		
		
      } catch (e) {
        app.innerHTML = "Hiba feldolgozás közben:<br><pre>" + e.message + "</pre>";
      }
    };

    const script = document.createElement("script");
    script.src = "https://docs.google.com/spreadsheets/d/1Ni_NBunNrlJ1RNkNGH8R64w_Jjy0N3gFB2YNi4DfX6w/gviz/tq?gid=2102518483&tqx=out:json;responseHandler:handleSheetData";

    script.onerror = function() {
      app.innerHTML = "Nem sikerült betölteni a Google Sheet adatokat.";
    };

    document.body.appendChild(script);
  </script>

</body>
